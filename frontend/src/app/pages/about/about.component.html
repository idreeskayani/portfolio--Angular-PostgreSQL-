<section id="about" class="section">
  <div class="section-inner">
    <h2 class="section-title anim fade-up">🚀 About Me</h2>
    @if (data) {
    <div class="about-grid">
      <div class="about-text">
        @for (p of data.aboutParagraphs; track $index) {
          <p>{{ p }}</p>
        }
      </div>
      <div class="about-right">
        <div class="goal-card">
          <h3>🎯 My Goal</h3>
          <p>{{ data.goalText }}</p>
          <ul>
            @for (interest of data.interests; track $index) {
              <li>{{ interest }}</li>
            }
          </ul>
        </div>
        <div class="edu-card">
          <h3>🎓 Education</h3>
          <p class="edu-degree">{{ data.degree }}</p>
          <p class="edu-inst">{{ data.institution }}</p>
          <span class="edu-period">{{ data.educationPeriod }}</span>
        </div>
      </div>
    </div>
    }
  </div>
</section>
